<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kunci — Authenticator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
  :root{
    --bg:#0e1016; --bg-grad:#141824;
    --panel:#191d2b; --panel-2:#20263a;
    --line:#2b3350; --line-soft:#222a41;
    --ink:#eef1fa; --ink-dim:#9aa3c0; --ink-faint:#5f6788;
    --gold:#f4b740; --danger:#ff6a6a; --ok:#5fd39c;
    --ring-track:#252c42;
    font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);
    background:radial-gradient(1100px 520px at 50% -10%, var(--bg-grad), transparent 70%), var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:26px 18px 128px;min-height:100%;display:flex;flex-direction:column}
  .hidden{display:none !important}

  /* ---- header ---- */
  header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .mark{width:40px;height:40px;border-radius:12px;flex:none;
    background:linear-gradient(150deg,#2a3150,#161a28);border:1px solid var(--line);
    display:grid;place-items:center;box-shadow:inset 0 1px 0 #ffffff10}
  .mark svg{width:20px;height:20px}
  .brand{flex:1}
  .brand h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.02em}
  .brand p{margin:1px 0 0;font-size:12.5px;color:var(--ink-faint)}
  .iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#ffffff06;
    color:var(--ink-dim);cursor:pointer;display:grid;place-items:center}
  .iconbtn:hover{color:var(--ink);border-color:#3a4568}
  .iconbtn svg{width:18px;height:18px}
  .hgap{display:flex;gap:8px}

  /* ---- search ---- */
  .search{position:relative;margin-bottom:16px}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-faint)}
  .search input{width:100%;background:#0d101a;border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-size:14.5px;padding:11px 12px 11px 38px;border-radius:12px}
  .search input:focus{outline:none;border-color:var(--gold)}

  /* ---- empty ---- */
  .empty{text-align:center;padding:52px 20px;color:var(--ink-dim);
    border:1px dashed var(--line);border-radius:18px;background:#ffffff04}
  .empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px;font-weight:600}
  .empty span{font-size:13.5px;line-height:1.5}

  /* ---- account card ---- */
  .card{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:18px;padding:16px 16px 16px 18px;margin-bottom:12px;
    display:flex;align-items:center;gap:14px;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);opacity:.85}
  .meta{flex:1;min-width:0}
  .issuer{font-size:11px;color:var(--ink-faint);letter-spacing:.04em;margin-bottom:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .label{font-size:14px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:7px}
  .code{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:30px;letter-spacing:.10em;
    line-height:1;cursor:pointer;display:inline-flex;user-select:none;transition:color .15s}
  .code:active{color:var(--gold)}
  .copied{position:absolute;top:14px;right:54px;font-size:11px;color:var(--ok);background:#5fd39c1a;
    padding:3px 8px;border-radius:99px;opacity:0;transform:translateY(-3px);transition:.18s;pointer-events:none}
  .copied.show{opacity:1;transform:none}
  .ring{flex:none;width:46px;height:46px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .rem{position:absolute;inset:0;display:grid;place-items:center;
    font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--ink-dim)}
  .del{position:absolute;top:12px;right:14px;width:24px;height:24px;border:none;border-radius:8px;
    background:transparent;color:var(--ink-faint);cursor:pointer;display:grid;place-items:center;opacity:.5}
  .del:hover{opacity:1;color:var(--danger);background:#ff6a6a14}
  .del svg{width:14px;height:14px}

  footer{margin-top:auto;padding-top:26px;text-align:center;font-size:12.5px;color:var(--ink-faint)}
  footer b{color:var(--ink-dim);font-weight:600}

  /* ---- FAB ---- */
  .fab{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(22px + env(safe-area-inset-bottom,0px));
    background:var(--gold);color:#1a1400;border:none;font-family:inherit;font-weight:700;font-size:15px;
    padding:14px 24px;border-radius:99px;cursor:pointer;
    box-shadow:0 10px 30px -8px #f4b74066, 0 2px 0 #00000030;display:flex;align-items:center;gap:8px;z-index:20}
  .fab:active{transform:translateX(-50%) translateY(1px)}
  .fab svg{width:18px;height:18px}

  /* ---- lock screen ---- */
  .lock{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:center;
    align-items:center;padding:32px;text-align:center;
    background:radial-gradient(900px 500px at 50% 20%, var(--bg-grad), transparent 70%), var(--bg)}
  .lock .mark{width:56px;height:56px;border-radius:16px;margin-bottom:22px}
  .lock .mark svg{width:28px;height:28px}
  .lock h2{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:-.02em}
  .lock p{margin:0 0 26px;font-size:14px;color:var(--ink-dim);max-width:300px;line-height:1.5}
  .lock .field{width:100%;max-width:320px}
  .pw{width:100%;background:#0d101a;border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-size:16px;padding:14px 15px;border-radius:13px;margin-bottom:12px;text-align:center;letter-spacing:.03em}
  .pw:focus{outline:none;border-color:var(--gold)}
  .lock .go{width:100%;max-width:320px;background:var(--gold);color:#1a1400;border:none;
    font-family:inherit;font-weight:700;font-size:16px;padding:14px;border-radius:13px;cursor:pointer}
  .lock .go:active{transform:translateY(1px)}
  .lock .err{color:var(--danger);font-size:13px;min-height:18px;margin:4px 0 10px}
  .lock .small{font-size:12px;color:var(--ink-faint);margin-top:18px;line-height:1.5;max-width:320px}

  /* ---- sheet ---- */
  .scrim{position:fixed;inset:0;background:#05060bcc;backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:.22s;z-index:30}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:520px;margin:0 auto;
    background:linear-gradient(180deg,#1b2032,#12151f);border-top:1px solid var(--line);
    border-radius:22px 22px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom,0px));
    transform:translateY(102%);transition:transform .28s cubic-bezier(.22,1,.36,1);max-height:92vh;overflow-y:auto}
  .sheet.open{transform:none}
  .grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 16px}
  .sheet h2{margin:0 0 4px;font-size:18px;font-weight:700}
  .sheet .hint{margin:0 0 18px;font-size:13px;color:var(--ink-faint);line-height:1.5}
  label.f{display:block;font-size:12px;color:var(--ink-dim);margin:0 0 6px 2px;font-weight:500}
  input.f,select.f,textarea.f{width:100%;background:#0d101a;border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-size:15px;padding:12px 13px;border-radius:12px;margin-bottom:14px}
  input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--gold)}
  input.f.mono,textarea.f.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.04em}
  textarea.f{resize:vertical;min-height:88px}
  .row{display:flex;gap:12px}
  .row>div{flex:1}
  .err{color:var(--danger);font-size:12.5px;min-height:16px;margin:-6px 0 12px 2px}
  .okmsg{color:var(--ok);font-size:12.5px;min-height:16px;margin:-6px 0 12px 2px}
  .actions{display:flex;gap:10px;margin-top:4px}
  .btn{flex:1;font-family:inherit;font-weight:600;font-size:15px;padding:13px;border-radius:12px;cursor:pointer;border:1px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--ink-dim)}
  .btn.ghost:active{background:#ffffff08}
  .btn.go{background:var(--gold);color:#1a1400;border-color:var(--gold)}
  .btn.go:active{transform:translateY(1px)}
  .btn.danger{background:#ff6a6a16;color:var(--danger);border-color:#ff6a6a44}
  .btn:disabled{opacity:.5;cursor:default}
  .tabs{display:flex;gap:6px;background:#0d101a;padding:4px;border-radius:12px;margin-bottom:18px}
  .tabs button{flex:1;border:none;background:transparent;color:var(--ink-dim);font-family:inherit;
    font-weight:600;font-size:13.5px;padding:9px;border-radius:9px;cursor:pointer}
  .tabs button.on{background:var(--panel-2);color:var(--ink)}
  .divider{height:1px;background:var(--line-soft);margin:20px 0}
  .setgroup label.f{margin-bottom:8px}

  /* ---- scanner ---- */
  .scanbox{position:relative;width:100%;aspect-ratio:1;background:#000;border-radius:16px;overflow:hidden;margin-bottom:14px}
  .scanbox video{width:100%;height:100%;object-fit:cover}
  .scanbox .frame{position:absolute;inset:14%;border:2px solid #ffffffaa;border-radius:14px;box-shadow:0 0 0 100vmax #00000066}
  .scan-status{font-size:13px;color:var(--ink-dim);text-align:center;margin-bottom:14px;min-height:18px}
</style>
</head>
<body>

<!-- ============ LOCK / SETUP SCREEN ============ -->
<div class="lock" id="lockScreen">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="#f4b740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="15" r="4"/><line x1="10.8" y1="12.2" x2="20" y2="3"/><line x1="17" y1="6" x2="20" y2="9"/><line x1="15" y1="8" x2="18" y2="11"/>
    </svg>
  </div>
  <h2 id="lockTitle">Buka Kunci</h2>
  <p id="lockDesc">Masukkan kata sandi utama untuk membuka brankasmu.</p>
  <div class="field">
    <input type="password" class="pw" id="pw1" placeholder="Kata sandi utama" autocomplete="off">
    <input type="password" class="pw hidden" id="pw2" placeholder="Ulangi kata sandi" autocomplete="off">
    <div class="err" id="lockErr"></div>
    <button class="go" id="lockGo">Buka</button>
  </div>
  <div class="small" id="lockNote"></div>
</div>

<!-- ============ MAIN APP ============ -->
<div class="wrap hidden" id="app">
  <header>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#f4b740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="15" r="4"/><line x1="10.8" y1="12.2" x2="20" y2="3"/><line x1="17" y1="6" x2="20" y2="9"/><line x1="15" y1="8" x2="18" y2="11"/>
      </svg>
    </div>
    <div class="brand"><h1>Kunci</h1><p>Terenkripsi &amp; dihitung di perangkatmu</p></div>
    <div class="hgap">
      <button class="iconbtn" id="settingsBtn" title="Pengaturan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="iconbtn" id="lockBtn" title="Kunci sekarang">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </button>
    </div>
  </header>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    <input id="searchIn" placeholder="Cari layanan atau akun…" autocomplete="off">
  </div>

  <div id="list"></div>

  <footer>by <b>Malika Shakila</b></footer>
</div>

<button class="fab hidden" id="addBtn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  Tambah akun
</button>

<!-- ============ ADD SHEET ============ -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="addSheet">
  <div class="grab"></div>
  <h2>Tambah akun</h2>
  <div class="tabs">
    <button id="tabScan" class="on">Scan QR</button>
    <button id="tabManual">Manual</button>
  </div>

  <!-- scan tab -->
  <div id="scanPane">
    <div class="scanbox"><video id="video" playsinline muted></video><div class="frame"></div></div>
    <div class="scan-status" id="scanStatus">Arahkan kamera ke QR code…</div>
    <div class="actions"><button class="btn ghost" id="scanCancel">Tutup</button></div>
  </div>

  <!-- manual tab -->
  <div id="manualPane" class="hidden">
    <label class="f" for="secret">Kunci rahasia (Base32) atau otpauth://…</label>
    <input class="f mono" id="secret" placeholder="JBSWY3DPEHPK3PXP" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row">
      <div><label class="f" for="issuer">Layanan</label><input class="f" id="issuer" placeholder="mis. GitHub" autocomplete="off"></div>
      <div><label class="f" for="account">Akun</label><input class="f" id="account" placeholder="kamu@email.com" autocomplete="off"></div>
    </div>
    <div class="err" id="addErr"></div>
    <div class="actions">
      <button class="btn ghost" id="addCancel">Batal</button>
      <button class="btn go" id="saveBtn">Simpan akun</button>
    </div>
  </div>
</div>

<!-- ============ SETTINGS SHEET ============ -->
<div class="sheet" id="setSheet">
  <div class="grab"></div>
  <h2>Pengaturan</h2>

  <div class="setgroup">
    <label class="f">Auto-lock saat tidak aktif</label>
    <select class="f" id="autolockSel">
      <option value="30000">30 detik</option>
      <option value="60000">1 menit</option>
      <option value="300000">5 menit</option>
      <option value="0">Mati</option>
    </select>
  </div>

  <div class="divider"></div>

  <label class="f">Backup terenkripsi</label>
  <p class="hint">Cadangan tetap terenkripsi dengan kata sandi utamamu. Simpan teksnya di tempat aman.</p>
  <div class="actions" style="margin-bottom:14px">
    <button class="btn ghost" id="exportBtn">Salin backup</button>
    <button class="btn ghost" id="importToggle">Pulihkan…</button>
  </div>
  <div id="importArea" class="hidden">
    <textarea class="f mono" id="importText" placeholder="Tempel teks backup di sini…"></textarea>
    <div class="err" id="importErr"></div>
    <button class="btn go" id="importBtn" style="width:100%">Pulihkan &amp; timpa brankas</button>
  </div>
  <div class="okmsg" id="setMsg"></div>

  <div class="divider"></div>

  <label class="f">Ubah kata sandi utama</label>
  <input type="password" class="f" id="curPw" placeholder="Kata sandi lama" autocomplete="off">
  <div class="row">
    <div><input type="password" class="f" id="newPw" placeholder="Kata sandi baru" autocomplete="off"></div>
    <div><input type="password" class="f" id="newPw2" placeholder="Ulangi" autocomplete="off"></div>
  </div>
  <div class="err" id="pwErr"></div>
  <button class="btn go" id="changePwBtn" style="width:100%;margin-bottom:18px">Perbarui kata sandi</button>

  <div class="divider"></div>
  <button class="btn danger" id="wipeBtn" style="width:100%">Hapus semua &amp; reset brankas</button>
  <div style="height:8px"></div>
  <button class="btn ghost" id="setClose" style="width:100%">Tutup</button>
</div>

<script>
"use strict";

/* ================= TOTP core (RFC 6238) ================= */
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function base32Decode(input){
  const s=input.replace(/=+$/,'').replace(/\s+/g,'').toUpperCase();
  if(!s) throw new Error('Kunci kosong');
  let bits=0,val=0;const out=[];
  for(const ch of s){
    const idx=B32.indexOf(ch);
    if(idx===-1) throw new Error('Karakter Base32 tidak valid: "'+ch+'"');
    val=(val<<5)|idx;bits+=5;
    if(bits>=8){out.push((val>>>(bits-8))&0xff);bits-=8;}
  }
  return new Uint8Array(out);
}
const HASH={SHA1:'SHA-1',SHA256:'SHA-256',SHA512:'SHA-512'};
async function totp(acc,when){
  const t=(when??Date.now())/1000, period=acc.period||30;
  const counter=Math.floor(t/period);
  const buf=new ArrayBuffer(8), dv=new DataView(buf);
  dv.setUint32(0, Math.floor(counter/2**32), false);
  dv.setUint32(4, counter>>>0, false);
  const key=base32Decode(acc.secret);
  const ck=await crypto.subtle.importKey('raw',key,{name:'HMAC',hash:{name:HASH[acc.algorithm||'SHA1']||'SHA-1'}},false,['sign']);
  const mac=new Uint8Array(await crypto.subtle.sign('HMAC',ck,buf));
  const off=mac[mac.length-1]&0x0f;
  const bin=((mac[off]&0x7f)<<24)|(mac[off+1]<<16)|(mac[off+2]<<8)|mac[off+3];
  const d=acc.digits||6;
  return (bin%(10**d)).toString().padStart(d,'0');
}
function parseOtpauth(uri){
  const u=new URL(uri.trim());
  if(u.protocol!=='otpauth:') throw new Error('Bukan tautan otpauth');
  if(u.host.toLowerCase()!=='totp') throw new Error('Hanya TOTP yang didukung');
  const p=u.searchParams, secret=p.get('secret');
  if(!secret) throw new Error('Tautan tidak punya secret');
  let issuer=p.get('issuer')||'', account=decodeURIComponent(u.pathname.replace(/^\//,''));
  if(account.includes(':')){const[a,b]=account.split(':');if(!issuer)issuer=a;account=b.trim();}
  return {secret:secret.replace(/\s/g,''),issuer,account,
    digits:parseInt(p.get('digits'))||6,period:parseInt(p.get('period'))||30,
    algorithm:(p.get('algorithm')||'SHA1').toUpperCase()};
}

/* ================= encryption (PBKDF2 + AES-GCM) ================= */
const VKEY='kunci.vault.v2', PREF='kunci.pref.v2', ITER=310000;
function b64(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s);}
function ub64(str){const bin=atob(str),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
async function deriveKey(password,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,
    {name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encrypt(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return {iv:b64(iv),ct:b64(new Uint8Array(ct))};
}
async function decrypt(key,iv_b64,ct_b64){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(iv_b64)},key,ub64(ct_b64));
  return JSON.parse(new TextDecoder().decode(pt));
}
function readVault(){try{return JSON.parse(localStorage.getItem(VKEY)||'null');}catch(e){return null;}}
async function writeVault(key,accounts){
  const enc=await encrypt(key,accounts);
  const v=readVault();
  localStorage.setItem(VKEY,JSON.stringify({ver:2,salt:v.salt,iter:v.iter,iv:enc.iv,ct:enc.ct}));
}
function getPref(){try{return JSON.parse(localStorage.getItem(PREF)||'{}');}catch(e){return {};}}
function setPref(p){try{localStorage.setItem(PREF,JSON.stringify(p));}catch(e){}}

/* ================= state ================= */
let masterKey=null, accounts=[], rafId=null, autolockMs=60000, idleTimer=null;

/* ================= DOM ================= */
const $=id=>document.getElementById(id);
const lockScreen=$('lockScreen'),app=$('app'),fab=$('addBtn'),listEl=$('list');
const R=20,C=2*Math.PI*R;

/* ---- lock / setup flow ---- */
function showLock(mode){ // mode: 'unlock' | 'create'
  stopTick(); stopScan(); masterKey=null; accounts=[];
  app.classList.add('hidden'); fab.classList.add('hidden');
  closeAll();
  lockScreen.classList.remove('hidden');
  const pw2=$('pw2');
  if(mode==='create'){
    $('lockTitle').textContent='Buat brankas';
    $('lockDesc').textContent='Pilih kata sandi utama. Dipakai untuk mengenkripsi semua kode di perangkat ini.';
    $('lockGo').textContent='Buat brankas';
    pw2.classList.remove('hidden');
    $('lockNote').textContent='Kata sandi ini tidak bisa dipulihkan. Kalau lupa, kamu harus reset dan menambah ulang akun.';
  }else{
    $('lockTitle').textContent='Buka Kunci';
    $('lockDesc').textContent='Masukkan kata sandi utama untuk membuka brankasmu.';
    $('lockGo').textContent='Buka';
    pw2.classList.add('hidden');
    $('lockNote').textContent='';
  }
  lockScreen.dataset.mode=mode;
  $('pw1').value='';pw2.value='';$('lockErr').textContent='';
  setTimeout(()=>$('pw1').focus(),100);
}

async function handleLockGo(){
  const mode=lockScreen.dataset.mode, pw=$('pw1').value;
  const err=$('lockErr');
  if(!pw){err.textContent='Masukkan kata sandi.';return;}
  $('lockGo').disabled=true;
  try{
    if(mode==='create'){
      if(pw.length<6){err.textContent='Minimal 6 karakter.';return;}
      if(pw!==$('pw2').value){err.textContent='Kata sandi tidak sama.';return;}
      const salt=crypto.getRandomValues(new Uint8Array(16));
      const key=await deriveKey(pw,salt,ITER);
      const enc=await encrypt(key,[]);
      localStorage.setItem(VKEY,JSON.stringify({ver:2,salt:b64(salt),iter:ITER,iv:enc.iv,ct:enc.ct}));
      masterKey=key; accounts=[];
      enterApp();
    }else{
      const v=readVault();
      const key=await deriveKey(pw,ub64(v.salt),v.iter||ITER);
      accounts=await decrypt(key,v.iv,v.ct); // throws on wrong password
      masterKey=key;
      enterApp();
    }
  }catch(e){
    err.textContent = (mode==='unlock') ? 'Kata sandi salah.' : ('Gagal: '+e.message);
  }finally{ $('lockGo').disabled=false; }
}
$('lockGo').addEventListener('click',handleLockGo);
$('pw1').addEventListener('keydown',e=>{if(e.key==='Enter'){if(lockScreen.dataset.mode==='create')$('pw2').focus();else handleLockGo();}});
$('pw2').addEventListener('keydown',e=>{if(e.key==='Enter')handleLockGo();});

function enterApp(){
  lockScreen.classList.add('hidden');
  app.classList.remove('hidden'); fab.classList.remove('hidden');
  autolockMs = getPref().autolock ?? 60000;
  $('autolockSel').value=String(autolockMs);
  build(); startTick(); resetIdle();
}

async function persist(){ if(masterKey) await writeVault(masterKey,accounts); }

/* ================= render ================= */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(code){const mid=Math.ceil(code.length/2);
  return esc(code.slice(0,mid))+'<span style="width:.28em;display:inline-block"></span>'+esc(code.slice(mid));}

function build(){
  const q=($('searchIn').value||'').toLowerCase().trim();
  const items=accounts.map((a,i)=>({a,i}))
    .filter(({a})=>!q||((a.issuer||'')+' '+(a.account||'')).toLowerCase().includes(q));
  if(accounts.length===0){
    listEl.innerHTML=`<div class="empty"><strong>Brankas kosong</strong><span>Ketuk “Tambah akun” untuk scan QR code atau memasukkan kunci secara manual.</span></div>`;return;
  }
  if(items.length===0){listEl.innerHTML=`<div class="empty"><span>Tidak ada yang cocok dengan pencarianmu.</span></div>`;return;}
  listEl.innerHTML=items.map(({a,i})=>`
    <div class="card" data-i="${i}">
      <div class="meta">
        <div class="issuer">${esc(a.issuer||'Akun')}</div>
        <div class="label">${esc(a.account||'')}</div>
        <div class="code" data-code="${i}" title="Ketuk untuk menyalin">••• •••</div>
      </div>
      <div class="ring"><svg width="46" height="46">
        <circle cx="23" cy="23" r="${R}" fill="none" stroke="var(--ring-track)" stroke-width="3.5"/>
        <circle class="prog" data-prog="${i}" cx="23" cy="23" r="${R}" fill="none" stroke="var(--gold)" stroke-width="3.5"
          stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="0"/>
      </svg><div class="rem" data-rem="${i}">30</div></div>
      <div class="copied" data-copied="${i}">Disalin</div>
      <button class="del" data-del="${i}" title="Hapus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>`).join('');
}

async function tick(){
  const now=Date.now();
  for(let i=0;i<accounts.length;i++){
    const a=accounts[i],period=(a.period||30)*1000, rem=period-(now%period), remS=Math.ceil(rem/1000);
    const prog=listEl.querySelector(`[data-prog="${i}"]`), remEl=listEl.querySelector(`[data-rem="${i}"]`);
    if(prog){prog.style.strokeDashoffset=(C*(1-rem/period)).toFixed(1);prog.style.stroke=remS<=5?'var(--danger)':'var(--gold)';}
    if(remEl){remEl.textContent=remS;remEl.style.color=remS<=5?'var(--danger)':'var(--ink-dim)';}
    const codeEl=listEl.querySelector(`[data-code="${i}"]`);
    if(codeEl){try{const c=await totp(a,now);if(codeEl.dataset.val!==c){codeEl.dataset.val=c;codeEl.innerHTML=fmt(c);}}
      catch(e){codeEl.textContent='error';codeEl.style.color='var(--danger)';}}
  }
  rafId=requestAnimationFrame(()=>setTimeout(tick,250));
}
function startTick(){stopTick();tick();}
function stopTick(){if(rafId)cancelAnimationFrame(rafId);rafId=null;}

/* card interactions */
listEl.addEventListener('click',e=>{
  const codeEl=e.target.closest('[data-code]');
  if(codeEl){const v=codeEl.dataset.val;if(!v)return;navigator.clipboard?.writeText(v).catch(()=>{});
    const tag=listEl.querySelector(`[data-copied="${codeEl.dataset.code}"]`);
    if(tag){tag.classList.add('show');setTimeout(()=>tag.classList.remove('show'),1100);}return;}
  const del=e.target.closest('[data-del]');
  if(del){const i=+del.dataset.del;
    if(confirm(`Hapus ${accounts[i].issuer||'akun'} — ${accounts[i].account||''}?`)){
      accounts.splice(i,1);persist();build();}}
});
$('searchIn').addEventListener('input',build);

/* ================= add sheet ================= */
const scrim=$('scrim');
function openSheet(el){scrim.classList.add('open');el.classList.add('open');}
function closeAll(){scrim.classList.remove('open');
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));stopScan();}
scrim.addEventListener('click',closeAll);

$('addBtn').addEventListener('click',()=>{openSheet($('addSheet'));switchTab('scan');});
$('addCancel').addEventListener('click',closeAll);
$('scanCancel').addEventListener('click',closeAll);

function switchTab(which){
  const scan=which==='scan';
  $('tabScan').classList.toggle('on',scan);$('tabManual').classList.toggle('on',!scan);
  $('scanPane').classList.toggle('hidden',!scan);$('manualPane').classList.toggle('hidden',scan);
  if(scan) startScan(); else stopScan();
}
$('tabScan').addEventListener('click',()=>switchTab('scan'));
$('tabManual').addEventListener('click',()=>switchTab('manual'));

/* ---- QR scanner ---- */
let stream=null, scanLoop=null, canvas=document.createElement('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
async function startScan(){
  const status=$('scanStatus'), video=$('video');
  if(stream)return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject=stream; await video.play();
    status.textContent='Arahkan kamera ke QR code…';
    const detector=('BarcodeDetector'in window)?new window.BarcodeDetector({formats:['qr_code']}):null;
    scanLoop=setInterval(async()=>{
      if(video.readyState<2)return;
      let text=null;
      try{
        if(detector){const codes=await detector.detect(video);if(codes.length)text=codes[0].rawValue;}
        else if(window.jsQR){
          canvas.width=video.videoWidth;canvas.height=video.videoHeight;
          ctx.drawImage(video,0,0,canvas.width,canvas.height);
          const img=ctx.getImageData(0,0,canvas.width,canvas.height);
          const r=window.jsQR(img.data,img.width,img.height);if(r)text=r.data;
        }else{status.textContent='Browser ini tak bisa scan — pakai tab Manual.';}
      }catch(e){}
      if(text) onScanResult(text);
    },350);
  }catch(e){
    status.textContent='Kamera tak bisa diakses. Pakai tab Manual.';
  }
}
function stopScan(){
  if(scanLoop){clearInterval(scanLoop);scanLoop=null;}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  const v=$('video'); if(v) v.srcObject=null;
}
async function onScanResult(text){
  if(!text.toLowerCase().startsWith('otpauth://')){$('scanStatus').textContent='QR bukan kode otpauth. Coba lagi.';return;}
  stopScan();
  try{
    const acc=parseOtpauth(text); await totp(acc);
    accounts.push(acc); await persist(); build();
    closeAll();
  }catch(e){$('scanStatus').textContent='Gagal membaca: '+e.message; startScan();}
}

/* ---- manual add ---- */
$('secret').addEventListener('input',()=>{
  const v=$('secret').value.trim();
  if(v.toLowerCase().startsWith('otpauth://')){
    try{const p=parseOtpauth(v);$('secret').value=p.secret;
      if(p.issuer)$('issuer').value=p.issuer;if(p.account)$('account').value=p.account;
      $('secret').dataset.opts=JSON.stringify({digits:p.digits,period:p.period,algorithm:p.algorithm});
      $('addErr').textContent='';
    }catch(e){$('addErr').textContent=e.message;}
  }else delete $('secret').dataset.opts;
});
$('saveBtn').addEventListener('click',async()=>{
  const err=$('addErr');err.textContent='';
  const raw=$('secret').value.trim();
  if(!raw){err.textContent='Masukkan kunci rahasia dulu.';return;}
  let acc;
  try{
    if(raw.toLowerCase().startsWith('otpauth://'))acc=parseOtpauth(raw);
    else{const o=$('secret').dataset.opts?JSON.parse($('secret').dataset.opts):{};
      acc={secret:raw.replace(/\s/g,''),issuer:$('issuer').value.trim(),account:$('account').value.trim(),
        digits:o.digits||6,period:o.period||30,algorithm:o.algorithm||'SHA1'};}
    if(!acc.issuer)acc.issuer=$('issuer').value.trim();
    if(!acc.account)acc.account=$('account').value.trim();
    $('saveBtn').disabled=true;
    await totp(acc);
    accounts.push(acc);await persist();build();
    $('secret').value=$('issuer').value=$('account').value='';delete $('secret').dataset.opts;
    closeAll();
  }catch(e){err.textContent=e.message||'Kunci tidak valid.';}
  finally{$('saveBtn').disabled=false;}
});

/* ================= settings ================= */
$('settingsBtn').addEventListener('click',()=>{openSheet($('setSheet'));$('setMsg').textContent='';$('importArea').classList.add('hidden');});
$('setClose').addEventListener('click',closeAll);
$('lockBtn').addEventListener('click',()=>showLock('unlock'));

$('autolockSel').addEventListener('change',e=>{
  autolockMs=+e.target.value; const p=getPref();p.autolock=autolockMs;setPref(p);resetIdle();
});

$('exportBtn').addEventListener('click',async()=>{
  const blob=localStorage.getItem(VKEY);
  try{await navigator.clipboard.writeText(blob);$('setMsg').textContent='Backup terenkripsi disalin ke clipboard.';}
  catch(e){
    // fallback: show in the import textarea for manual copy
    $('importArea').classList.remove('hidden');$('importText').value=blob;$('importText').select();
    $('setMsg').textContent='Salin teks di kotak bawah.';
  }
});
$('importToggle').addEventListener('click',()=>$('importArea').classList.toggle('hidden'));
$('importBtn').addEventListener('click',async()=>{
  const err=$('importErr');err.textContent='';
  const txt=$('importText').value.trim();
  if(!txt){err.textContent='Tempel teks backup dulu.';return;}
  try{
    const v=JSON.parse(txt);
    if(!v.salt||!v.iv||!v.ct)throw new Error('Format backup tidak dikenali.');
    localStorage.setItem(VKEY,JSON.stringify(v));
    $('setMsg').textContent='Brankas dipulihkan. Membuka ulang…';
    setTimeout(()=>showLock('unlock'),700);
  }catch(e){err.textContent='Gagal: '+e.message;}
});

$('changePwBtn').addEventListener('click',async()=>{
  const err=$('pwErr');err.textContent='';
  const cur=$('curPw').value, np=$('newPw').value, np2=$('newPw2').value;
  if(np.length<6){err.textContent='Kata sandi baru minimal 6 karakter.';return;}
  if(np!==np2){err.textContent='Kata sandi baru tidak sama.';return;}
  try{
    const v=readVault();
    await deriveKey(cur,ub64(v.salt),v.iter||ITER).then(k=>decrypt(k,v.iv,v.ct)); // verify old pw
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const key=await deriveKey(np,salt,ITER);
    const enc=await encrypt(key,accounts);
    localStorage.setItem(VKEY,JSON.stringify({ver:2,salt:b64(salt),iter:ITER,iv:enc.iv,ct:enc.ct}));
    masterKey=key;
    $('curPw').value=$('newPw').value=$('newPw2').value='';
    $('setMsg').textContent='Kata sandi diperbarui.';
  }catch(e){err.textContent='Kata sandi lama salah.';}
});

$('wipeBtn').addEventListener('click',()=>{
  if(confirm('Ini menghapus SEMUA akun dan brankas dari perangkat ini. Yakin?')){
    localStorage.removeItem(VKEY);showLock('create');
  }
});

/* ================= auto-lock ================= */
function resetIdle(){
  clearTimeout(idleTimer);
  if(autolockMs>0 && masterKey) idleTimer=setTimeout(()=>showLock('unlock'), autolockMs);
}
['click','keydown','touchstart','mousemove'].forEach(ev=>
  document.addEventListener(ev,()=>{if(masterKey)resetIdle();},{passive:true}));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopScan();}
});

/* ================= boot ================= */
(function boot(){
  if(!('crypto'in window)||!crypto.subtle){
    document.body.innerHTML='<div class="lock"><h2>Tidak didukung</h2><p>Butuh HTTPS &amp; browser modern untuk enkripsi.</p></div>';return;
  }
  showLock(readVault()?'unlock':'create');
})();
</script>
</body>
</html>
